<svg viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hello, I am Giovanna Sampaio">
  <defs>
    <linearGradient id="nameBackdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCEFFB"/>
      <stop offset="100%" stop-color="#BFE3F8"/>
    </linearGradient>
    <clipPath id="typeReveal">
      <rect x="0" y="0" height="170" width="0">
        <animate attributeName="width" from="0" to="1000" dur="2.2s" fill="freeze" begin="0.2s"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="150" y="25" width="700" height="100" rx="26" fill="url(#nameBackdrop)" opacity="0.55"/>

  <g fill="#4FA8D8" opacity="0.35">
    <rect x="168" y="42" width="6" height="6"/>
    <rect x="826" y="108" width="6" height="6"/>
    <rect x="180" y="112" width="6" height="6"/>
    <rect x="814" y="40" width="6" height="6"/>
  </g>

  <g clip-path="url(#typeReveal)">
    <text x="239" y="88" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="30" fill="#2F6690" letter-spacing="1">Hello, I am Giovanna Sampaio</text>
  </g>

  <rect x="761" y="63" width="4" height="34" fill="#2F6690" opacity="0">
    <animate attributeName="opacity" values="1;0;1;0;1" dur="1.6s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
