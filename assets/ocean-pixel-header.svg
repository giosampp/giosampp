  <svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cena animada de mar em pixel art com gatinho, estrela-do-mar, notebook, estrelas e elementos de tecnologia em tons de azul-bebê">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FBFF"/>
      <stop offset="55%" stop-color="#DCEFFB"/>
      <stop offset="100%" stop-color="#BFE3F8"/>
    </linearGradient>

    <path id="waveBack"  d="M0,138 C62.5,122 62.5,122 125,138 C187.5,158 187.5,158 250,138 L250,240 L0,240 Z"/>
    <path id="waveMid"   d="M0,158 C62.5,138 62.5,138 125,158 C187.5,182 187.5,182 250,158 L250,240 L0,240 Z"/>
    <path id="waveFront" d="M0,180 C62.5,156 62.5,156 125,180 C187.5,208 187.5,208 250,180 L250,240 L0,240 Z"/>
  </defs>

  <rect x="0" y="0" width="1000" height="240" fill="url(#skyGrad)"/>

  <g fill="#FFFFFF">
