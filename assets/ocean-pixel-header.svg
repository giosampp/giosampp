    <rect x="38" y="0" width="8" height="8" fill="#2F6690"/>
    <rect x="10" y="8" width="36" height="24" fill="#2F6690"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1; 1,0.1; 1,1" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" additive="sum"/>
      <rect x="18" y="18" width="6" height="6" fill="#F3FBFF"/>
      <rect x="32" y="18" width="6" height="6" fill="#F3FBFF"/>
