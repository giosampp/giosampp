    <rect x="36" y="58" width="8" height="6" fill="#2F6690"/>
    <g transform="translate(52,44)">
      <animateTransform attributeName="transform" type="rotate" values="-6 0 0; 10 0 0; -6 0 0" dur="3.2s" repeatCount="indefinite" additive="sum"/>
      <rect x="0" y="-4" width="8" height="8" fill="#2F6690"/>
      <rect x="6" y="-14" width="8" height="8" fill="#2F6690"/>
      <rect x="2" y="-22" width="8" height="8" fill="#2F6690"/>
