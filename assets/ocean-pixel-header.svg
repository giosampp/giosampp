    </circle>
    <circle cx="150" cy="60" r="1.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="28" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="50" r="1.8">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="22" r="2.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="46" r="1.6">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="30" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#7FB8E0" font-family="Consolas, Menlo, monospace" font-size="15" opacity="0.55">
    <text x="110" y="90">&lt;/&gt;</text>
    <text x="420" y="78">{ }</text>
    <text x="700" y="88">01</text>
    <text x="850" y="70">&lt;/&gt;</text>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="4.5s" repeatCount="indefinite"/>
      <text x="260" y="60">{ }</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
      <text x="560" y="55">01</text>
    </g>
  </g>

  <g fill="#BFE3F8" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0; -250,0" dur="10s" repeatCount="indefinite"/>
