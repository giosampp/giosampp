<svg viewBox="0 0 1000 50" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divisor de onda decorativo em azul-bebê">
  <defs>
    <path id="waveDivider" d="M0,28 C62.5,10 62.5,10 125,28 C187.5,48 187.5,48 250,28 L250,50 L0,50 Z"/>
  </defs>
  <g fill="#C7D2F0" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0; -250,0" dur="9s" repeatCount="indefinite"/>
    <use href="#waveDivider" x="-250"/>
    <use href="#waveDivider" x="0"/>
    <use href="#waveDivider" x="250"/>
    <use href="#waveDivider" x="500"/>
    <use href="#waveDivider" x="750"/>
    <use href="#waveDivider" x="1000"/>
  </g>
  <g fill="#7B93DB">
    <animateTransform attributeName="transform" type="translate" values="0,0; -250,0" dur="5.5s" repeatCount="indefinite"/>
    <use href="#waveDivider" x="-100" transform="translate(0,8) scale(1,0.6)"/>
    <use href="#waveDivider" x="150" transform="translate(0,8) scale(1,0.6)"/>
    <use href="#waveDivider" x="400" transform="translate(0,8) scale(1,0.6)"/>
    <use href="#waveDivider" x="650" transform="translate(0,8) scale(1,0.6)"/>
    <use href="#waveDivider" x="900" transform="translate(0,8) scale(1,0.6)"/>
  </g>
</svg>
